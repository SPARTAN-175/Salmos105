<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <meta name="theme-color" content="#0A9F5A">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="assets/icon-192.png">
    <title>Salmos 105</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>

        <div class="titulo">

            <h1>🎵 Salmos 105</h1>

            <p>Con tecnología de <strong>MOTI</strong></p>

        </div>

        <button id="btnGuardar">
            Guardar configuración
        </button>

    </header>

    <main>

        <!-- =============================== -->
        <!-- ACORDES -->
        <!-- =============================== -->

        <section class="panel">

            <h2>Acordes</h2>

            <div id="contenedorAcordes"></div>

        </section>

        <!-- =============================== -->
        <!-- RESULTADO -->
        <!-- =============================== -->

        <section class="panel">

            <h2>Resultado</h2>

            <div id="resultado">

                <div class="imagenAcorde">

                    <img src="assets/acordes/C.png" alt="Do">

                    <span>Do</span>

                </div>

                <div class="imagenAcorde">

                    <img src="assets/acordes/C.png" alt="Do">

                    <span>Do</span>

                </div>

                <div class="imagenAcorde">

                    <img src="assets/acordes/C.png" alt="Do">

                    <span>Do</span>

                </div>

                <div class="imagenAcorde">

                    <img src="assets/acordes/C.png" alt="Do">

                    <span>Do</span>

                </div>

                <div class="imagenAcorde">

                    <img src="assets/acordes/C.png" alt="Do">

                    <span>Do</span>

                </div>

                <div class="imagenAcorde">

                    <img src="assets/acordes/C.png" alt="Do">

                    <span>Do</span>

                </div>

            </div>

        </section>

        <!-- =============================== -->
        <!-- TRANSPONER -->
        <!-- =============================== -->

        <section class="panel">

            <h2>Semitonos</h2>

            <div class="transponer">

                <button id="btnMenos">−</button>

                <span id="valorSemitono">0</span>

                <button id="btnMas">+</button>

            </div>

        </section>

        <!-- =============================== -->
        <!-- CONFIGURACIONES -->
        <!-- =============================== -->

        <section class="panel">

            <input
                id="buscarConfiguracion"
                type="search"
                placeholder="Buscar configuración..."
            >

            <table>

                <thead>

                    <tr>

                        <th>Nombre</th>

                        <th>Tono</th>

                    </tr>

                </thead>

                <tbody id="listaConfiguraciones">

                    <tr>

                        <td>Alabanza Domingo</td>

                        <td>Do</td>

                    </tr>

                    <tr>

                        <td>Ensayo Jóvenes</td>

                        <td>Re</td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
