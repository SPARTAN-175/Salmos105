<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Salmos 115</title>

    <meta
        name="theme-color"
        content="#10A651">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="apple-touch-icon"
        href="assets/icon-192.png">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<!-- ==========================
        ENCABEZADO
========================== -->

<header class="header">

    <div class="headerInfo">

        <img
            src="assets/icon-192.png"
            class="logo"
            alt="Logo">

        <div>

            <h1>

                Salmos 115

            </h1>

            <p>

                Con tecnología de
                <strong>MOTI</strong>

            </p>

        </div>

    </div>

    <div class="headerAcciones">

        <button
            id="btnGuardar"
            class="btnGuardar"
            title="Guardar">

            💾

        </button>

        <button
            id="btnMenu"
            class="btnMenu"
            title="Menú">

            ⋮

        </button>

    </div>

</header>

<!-- ==========================
     ALABANZA ACTUAL
========================== -->

<section class="alabanzaActual">

    <h2 id="nombreAlabanza">

        Sin alabanza seleccionada

    </h2>

    <div class="accionesAlabanza">

        <div
            id="selectorVersion"
            class="selectorVersion oculto">

            <button id="btnAnteriorVersion">

                ◀

            </button>

            <div class="tonoCaja">

                <span class="textoTono">

                    TONO

                </span>

                <span id="tonoActual">

                    Do

                </span>

            </div>

            <button id="btnSiguienteVersion">

                ▶

            </button>

        </div>

        <button
            id="btnEliminarConfiguracion"
            class="btnEliminar oculto">

            🗑

        </button>

    </div>

</section>

<!-- ==========================
        CONTENIDO
========================== -->

<main>
    <main>

    <!--=====================================
            AFINADOR
    ======================================-->

    <section class="barraHerramientas">

        <button
            id="btnDetectarNota"
            class="btnAccion">

            🎤
            <span>Nota</span>

        </button>

        <div class="resultadoDetector">

            <small>

                Nota detectada

            </small>

            <span id="estadoPitch">

                —

            </span>

        </div>

    </section>

    <!--=====================================
            ACORDES
    ======================================-->

    <section class="panel">

        <div id="contenedorAcordes"></div>

    </section>

    <!--=====================================
            SEMITONOS
    ======================================-->

    <section class="panelSemitonos">

        <button
            id="btnMenos"
            class="btnSemi">

            −

        </button>

        <span id="valorSemitono">

            0

        </span>

        <button
            id="btnMas"
            class="btnSemi">

            +

        </button>

    </section>

    <hr class="separador">

    <!--=====================================
            BUSCADOR
    ======================================-->

    <section>

        <input
            type="text"
            id="buscarConfiguracion"
            placeholder="Buscar configuración...">

    </section>

    <!--=====================================
            BIBLIOTECA
    ======================================-->

    <section class="lista">

        <div id="listaConfiguraciones">

        </div>

    </section>

</main>

<!-- Essentia -->

<script src="libs/essentia-wasm.web.js"></script>

<script src="libs/essentia.js-core.umd.js"></script>

<script src="libs/essentia.js-extractor.umd.js"></script>

<!-- Aplicación -->

<script type="module" src="js/app.js"></script>




<!-- ==========================
     VISOR DE ACORDES
========================== -->

<div id="visorAcorde" class="visor oculto">

    <div class="visorContenido">

        <h2 id="tituloVisor"></h2>

        <img
            id="imagenVisor"
            src=""
            alt="Acorde">

    </div>

</div>


    <!-- ==========================
     MODAL
========================== -->

<div id="modal" class="modal oculto">

    <div class="modalCaja">

        <h2 id="modalTitulo">

            Guardar alabanza

        </h2>

        <p id="modalMensaje">

        </p>

        <input
            id="modalInput"
            type="text"
            placeholder="Nombre de la alabanza">

        <div class="modalBotones">

            <button id="btnCancelarModal">

                Cancelar

            </button>

            <button id="btnAceptarModal">

                Guardar

            </button>

        </div>

    </div>

</div>


<!-- ==========================
     TOAST
========================== -->

<div id="toast" class="toast oculto">

    <span id="toastIcono">✔</span>

    <span id="toastTexto">

        Mensaje

    </span>

</div>


    <!-- ==========================
        MENÚ
========================== -->

<div id="menuFondo" class="menuFondo oculto">

    <div id="menuApp" class="menuApp">

        <div class="menuTitulo">

            <h3>

                Salmos 115

            </h3>

            <p id="menuVersion">

                Versión

            </p>

        </div>

        <hr>
        <button id="btnAnalizarCancion">

            🎼 Analizar canción

          </button>

        <button id="btnBuscarActualizacion">

            🔄 Buscar actualización

        </button>

        <button id="btnDescargarRecursos">

            📥 Descargar recursos

        </button>

        <hr>

        <button id="btnNovedades">

            📄 Novedades

        </button>

        <button id="btnAcerca">

            ℹ Acerca de

        </button>

    </div>

</div>
    
</body>

</html>
