<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Salmos 105</title>

    <meta name="theme-color" content="#10A651">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =======================
         ENCABEZADO
    ======================== -->

    <header class="header">

        <div class="titulo">

            <img src="assets/icon-192.png" class="logo" alt="Logo">

            <div>

                <h1>Salmos 105</h1>

                <p>Con tecnología de <strong>MOTI</strong></p>

            </div>

        </div>

        <button id="btnGuardar" class="btnGuardar">

            💾 Guardar

        </button>

    </header>

    <!-- ==========================
     ALABANZA ACTUAL
========================== -->

<section class="alabanzaActual">

    <h2 id="nombreAlabanza">

        Sin alabanza seleccionada

    </h2>

    <div id="selectorVersion" class="selectorVersion oculto">

        <button id="btnAnteriorVersion">

            ◀

        </button>

        <span id="tonoActual">

            Do

        </span>

        <button id="btnSiguienteVersion">

            ▶

        </button>

    </div>

</section>

    <!-- =======================
          CONTENIDO
    ======================== -->

    <main>

        <!-- ACORDES -->

        <section class="panel">

            <div id="contenedorAcordes"></div>

        </section>

        <!-- SEMITONOS -->

        <section class="panelSemitonos">

            <button id="btnMenos" class="btnSemi">

                −

            </button>

            <span id="valorSemitono">

                0

            </span>

            <button id="btnMas" class="btnSemi">

                +

            </button>

        </section>

        <hr class="separador">

        <!-- BUSCAR -->

        <section>

            <input
                type="text"
                id="buscarConfiguracion"
                placeholder="Buscar configuración...">

        </section>

        <!-- LISTA -->

        <section class="lista">

    <div id="listaConfiguraciones">

    </div>

        </section>

    </main>

    <script type="module" src="js/app.js"></script>





<!-- ==========================
     VISOR DE ACORDES
========================== -->

<div id="visorAcorde" class="visor oculto">

    <div class="visorContenido">

        <h2 id="tituloVisor"></h2>

        <img
            id="imagenVisor"
            src=""
            alt="Acorde">

    </div>

</div>


    <!-- ==========================
     MODAL
========================== -->

<div id="modal" class="modal oculto">

    <div class="modalCaja">

        <h2 id="modalTitulo">

            Guardar alabanza

        </h2>

        <p id="modalMensaje">

        </p>

        <input
            id="modalInput"
            type="text"
            placeholder="Nombre de la alabanza">

        <div class="modalBotones">

            <button id="btnCancelarModal">

                Cancelar

            </button>

            <button id="btnAceptarModal">

                Guardar

            </button>

        </div>

    </div>

</div>
    
</body>

</html>
